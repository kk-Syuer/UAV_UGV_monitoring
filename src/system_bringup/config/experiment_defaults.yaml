# Default values shared across experiments. Override these keys inside
# config/runs/<name>.yaml files as needed.

global:
  output_dir: /tmp/fanet_logs

network:
  neighbor_timeout_sec: 3.0
  comm_radius_m: 400.0

routing:
  recompute_period_sec: 2.0
  hysteresis_margin_m: 3.0
  ch_move_threshold_m: 7.5
  status_timeout_sec: 5.0

monitor:
  max_runtime_sec: 0.0
  stop_on_backbone_loss: false
  routing_table_empty_shutdown_sec: 10.0

experiment:
  termination_mode: "timeout_only"
  experiment_timeout_s: 10800

shutdown:
  after_sec: 0.0
  on_fleet_loss: false

weather:
  enable: true
  publish_period_sec: 1.0
  wind_mean: 0.0
  rain_mean: 0.0
  temp_c: 18.0


  mode: "markov"
  start_state: "sunny"
battery:
  # Keep UAV and UGV capacity assumptions aligned across nodes.
  member_capacity_wh: 100.0
  ch_capacity_wh: 200.0
  # Drain units are Wh/s. Defaults target ~45 min member and ~90 min CH nominal endurance.
  drain_rate_member: 0.037037
  drain_rate_ch: 0.037037
  # Fast-charging assumption: charger_power_w = 3600 * k * drain_rate, k=1.5
  charge_gain_multiplier: 1.5

fault_injector:
  enable: true
  drop_mode: bus
  p0: 0.0
  aw: 0.25
  ar: 0.35
  at: 0.10
  p_max: 0.6
  wind_max: 20.0
  rain_max: 1.0
  temp_opt: 18.0
  temp_span: 20.0
  drop_control_multiplier: 0.2
  drop_data_multiplier: 1.0

coverage_planner:
  enable: true
  # Simulation bounds; task points outside these ranges are clamped.
  x_min: 0.0
  x_max: 500.0
  y_min: 0.0
  y_max: 500.0
  taskpoint_generation_mode: fixed_file
  fixed_taskpoints_file: system_bringup/config/taskpoints/fixed_taskpoints.yaml
  fixed_taskpoints_count: 10
  fixed_taskpoints_seed: 0

planner_viz:
  enable: true

ch_manager:
  enable: true
  cluster_prefix: cluster

recovery_manager:
  enable: true
  status_timeout_sec: 5.0
  heartbeat_timeout_sec: 4.0
  recovery_cooldown_sec: 2.0

traffic:
  user_device_enable: true

task_telemetry:
  enable: true
  packets_min: 1
  packets_max: 3
  payload_bytes_min: 50
  payload_bytes_max: 200
  send_prob: 1.0
  ttl_hops: 16
  flow_label: SEARCH_TELEMETRY

telemetry_policy:
  mode: option_c
  tmax_sec: 120.0
  kmax: 10
  upload_batch: true
  log_debug: true
