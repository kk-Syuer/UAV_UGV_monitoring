# Default values shared across experiments. Override these keys inside
# config/runs/<name>.yaml files as needed.

global:
  output_dir: /tmp/fanet_logs

network:
  neighbor_timeout_sec: 3.0
  comm_radius_m: 400.0

routing:
  recompute_period_sec: 2.0
  hysteresis_margin_m: 3.0
  ch_move_threshold_m: 7.5
  status_timeout_sec: 5.0

monitor:
  max_runtime_sec: 0.0
  stop_on_backbone_loss: false

weather:
  enable: true
  publish_period_sec: 1.0
  wind_mean: 0.0
  rain_mean: 0.0
  temp_c: 18.0

fault_injector:
  enable: true
  drop_mode: bus
  p0: 0.0
  aw: 0.25
  ar: 0.35
  at: 0.10
  p_max: 0.6
  wind_max: 20.0
  rain_max: 1.0
  temp_opt: 18.0
  temp_span: 20.0
  drop_control_multiplier: 0.2
  drop_data_multiplier: 1.0

coverage_planner:
  enable: true

planner_viz:
  enable: true

ch_manager:
  enable: true
  cluster_prefix: cluster

recovery_manager:
  enable: true
  status_timeout_sec: 5.0
  heartbeat_timeout_sec: 4.0
  recovery_cooldown_sec: 2.0

traffic:
  user_device_enable: true

task_telemetry:
  enable: true
  packets_min: 1
  packets_max: 3
  payload_bytes_min: 50
  payload_bytes_max: 200
  send_prob: 1.0
  ttl_hops: 16
  flow_label: SEARCH_TELEMETRY
