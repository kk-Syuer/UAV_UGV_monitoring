global:
  run_id: ugv_edf_sunny_3
  output_dir: /home/vboxuser/UAV_UGV_netmonitoring/experiment_data_collection/test_round3

executables:
  monitor_pkg: network_monitor
  monitor_exec: network_monitor_node
  weather_pkg: weather_server
  weather_exec: weather_node
  injector_pkg: fault_injector
  injector_exec: fault_injector_node
  sink_pkg: sink_gateway
  sink_exec: sink_gateway_node
  routing_pkg: routing_manager
  routing_exec: routing_manager_node
  ugv_pkg: ugv_charger
  ugv_exec: ugv_charger_node
  planner_pkg: coverage_planner
  planner_exec: coverage_planner_node
  planner_viz_pkg: planner_viz
  planner_viz_exec: fleet_viz
  ch_manager_pkg: ch_manager
  ch_manager_exec: ch_manager_node
  user_device_pkg: user_devices_sim
  user_device_exec: user_device_node
  uav_pkg: uav_fleet
  uav_exec: uav_node

network:
  neighbor_timeout_sec: 3.0
  comm_radius_m: 400.0

monitor:
  flush_period_sec: 2.0
  status_sample_period_sec: 1.0

experiment:
  experiment_timeout_s: 10800

weather:
  enable: true
  wind_mean: 0.0
  rain_mean: 0.0
  temp_c: 18.0

  mode: "fixed"
  start_state: "sunny"
  transition_period_sec: 12.0
  transition_matrix:
    sunny:  {sunny: 0.60, cloudy: 0.25, windy: 0.10, rainy: 0.04, stormy: 0.01}
    cloudy: {sunny: 0.08, cloudy: 0.55, windy: 0.10, rainy: 0.25, stormy: 0.02}
    windy:  {sunny: 0.06, cloudy: 0.35, windy: 0.40, rainy: 0.15, stormy: 0.04}
    rainy:  {sunny: 0.02, cloudy: 0.20, windy: 0.10, rainy: 0.50, stormy: 0.18}
    stormy: {sunny: 0.01, cloudy: 0.10, windy: 0.14, rainy: 0.35, stormy: 0.40}

fault_injector:
  enable: true
  drop_mode: bus
  p0: 0.0
  aw: 0.25
  ar: 0.35
  at: 0.10
  p_max: 0.6
  wind_max: 20.0
  rain_max: 1.0
  temp_opt: 18.0
  temp_span: 20.0
  drop_control_multiplier: 0.2
  drop_data_multiplier: 1.0

sink:
  sink_id: sink_gateway
  uplink_ch_id: ch0

ugv:
  ugv_id: ugv_1
  charging_policy: edf
  max_parallel_spots: 3

  active_session_status_stale_sec: 8.0
  active_session_no_progress_sec: 20.0
  active_session_stale_confirm_cycles: 3
  active_session_no_progress_confirm_cycles: 3
battery:
  # Keep UAV and UGV capacity assumptions aligned across nodes.
  member_capacity_wh: 77.0
  ch_capacity_wh: 115.2
  # Drain units are Wh/s. Time-compression mode: 3h sim ~= 24h real effects (8x drain/charge pace).
  drain_rate_member: 0.223192
  drain_rate_ch: 0.279272
  # Charging assumption: charger_power_w = 3600 * k * drain_rate, k=1.0 (kept to preserve relative charge/discharge ratio under 8x scaling)
  charge_gain_multiplier: 1.0

coverage_planner:
  enable: true
  taskpoint_generation_mode: fixed_file
  fixed_taskpoints_file: system_bringup/config/taskpoints/fixed_taskpoints.yaml
  fixed_taskpoints_count: 10
  fixed_taskpoints_seed: 0
planner_viz:
  enable: true

ch_manager:
  enable: true
  cluster_prefix: cluster

recovery_manager:
  enable: true
  status_timeout_sec: 5.0
  heartbeat_timeout_sec: 4.0
  recovery_cooldown_sec: 2.0

traffic:
  user_device_enable: false

task_telemetry:
  enable: true
  packets_min: 1
  packets_max: 3
  payload_bytes_min: 50
  payload_bytes_max: 200
  send_prob: 1.0
  ttl_hops: 16
  flow_label: SEARCH_TELEMETRY

telemetry_policy:
  mode: option_c
  tmax_sec: 120.0
  kmax: 10
  upload_batch: true
  log_debug: false

uavs:
  ch_ids:
    - ch0
    - ch1
  members:
    - id: uav1
      role: 0
      my_ch_id: ch0
    - id: uav2
      role: 0
      my_ch_id: ch1
    - id: uav3
      role: 0
      my_ch_id: ch1
