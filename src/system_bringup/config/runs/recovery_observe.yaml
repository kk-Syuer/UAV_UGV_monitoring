global:
  run_id: recovery_observe
  output_dir: /tmp/fanet_logs

executables:
  monitor_pkg: network_monitor
  monitor_exec: network_monitor_node
  weather_pkg: weather_server
  weather_exec: weather_node
  injector_pkg: fault_injector
  injector_exec: fault_injector_node
  sink_pkg: sink_gateway
  sink_exec: sink_gateway_node
  routing_pkg: routing_manager
  routing_exec: routing_manager_node
  recovery_pkg: recovery_manager
  recovery_exec: recovery_manager_node
  ugv_pkg: ugv_charger
  ugv_exec: ugv_charger_node
  planner_pkg: coverage_planner
  planner_exec: coverage_planner_node
  planner_viz_pkg: planner_viz
  planner_viz_exec: fleet_viz
  ch_manager_pkg: ch_manager
  ch_manager_exec: ch_manager_node
  user_device_pkg: user_devices_sim
  user_device_exec: user_device_node
  uav_pkg: uav_fleet
  uav_exec: uav_node

network:
  # Keep moderate range so mobility/backbone changes can trigger routing alerts.
  comm_radius_m: 260.0
  neighbor_timeout_sec: 3.0

routing:
  recompute_period_sec: 1.0
  hysteresis_margin_m: 2.0
  ch_move_threshold_m: 5.0
  status_timeout_sec: 4.0

monitor:
  flush_period_sec: 1.0
  status_sample_period_sec: 1.0
  max_runtime_sec: 180.0
  stop_on_backbone_loss: false
  routing_table_empty_shutdown_sec: 15.0

weather:
  enable: true
  publish_period_sec: 1.0
  # Aggressive weather to induce packet drops in combination with injector settings.
  wind_mean: 14.0
  rain_mean: 0.8
  temp_c: 5.0

fault_injector:
  enable: true
  drop_mode: bus
  p0: 0.20
  aw: 0.35
  ar: 0.40
  at: 0.20
  p_max: 0.85
  wind_max: 20.0
  rain_max: 1.0
  temp_opt: 18.0
  temp_span: 20.0
  # Keep control packet drops meaningful so heartbeat/routing instability appears.
  drop_control_multiplier: 0.80
  drop_data_multiplier: 1.00

sink:
  sink_id: sink_gateway

ugv:
  ugv_id: ugv_1

coverage_planner:
  enable: true

planner_viz:
  enable: true

ch_manager:
  enable: true
  cluster_prefix: cluster

recovery_manager:
  enable: true
  status_timeout_sec: 4.0
  heartbeat_timeout_sec: 2.0
  recovery_cooldown_sec: 2.0

shutdown:
  after_sec: 180.0

traffic:
  user_device_enable: true

task_telemetry:
  enable: true
  packets_min: 1
  packets_max: 3
  payload_bytes_min: 80
  payload_bytes_max: 220
  send_prob: 1.0
  ttl_hops: 16
  flow_label: SEARCH_TELEMETRY

uavs:
  ch_ids:
    - ch0
    - ch1
    - ch2
  members:
    - id: uav1
      role: 0
      my_ch_id: ch0
    - id: uav2
      role: 0
      my_ch_id: ch0
    - id: uav3
      role: 0
      my_ch_id: ch1
    - id: uav4
      role: 0
      my_ch_id: ch1
    - id: uav5
      role: 0
      my_ch_id: ch2
    - id: uav6
      role: 0
      my_ch_id: ch2
